<text x="150" y="778" class="h">術前・術後の口腔ケア</text><text x="150" y="817" class="body">口の中を清潔に保ち、術後の合併症リスク低減を目指します。</text>
<text x="47" y="875" class="sm">※ 肺炎にはさまざまな原因があります。口腔ケアだけで完全に防げるという意味ではありません。</text></svg>