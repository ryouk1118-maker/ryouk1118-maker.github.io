<text x="47" y="74" class="t">口腔衛生と術後肺炎のリスク</text><text x="48" y="152" class="sub">口の中の細菌が、気道や肺の合併症に関係することがあります。</text><rect x="38" y="208" width="314" height="483" rx="24" fill="#fff" stroke="#bbdcea" stroke-width="3"/>
<rect x="51" y="223" width="288" height="76" rx="18" fill="#dbf1fa"/>
<text x="195" y="273" class="h" text-anchor="middle">口の中の細菌</text>
<text x="195" y="613" class="body" text-anchor="middle">歯垢などに</text>
<text x="195" y="653" class="body" text-anchor="middle">細菌が多い状態</text><rect x="443" y="208" width="314" height="483" rx="24" fill="#fff" stroke="#bbdcea" stroke-width="3"/>
<rect x="456" y="223" width="288" height="76" rx="18" fill="#dbf1fa"/>
<text x="600" y="273" class="h" text-anchor="middle">気道へ入り込む</text>
<text x="600" y="613" class="body" text-anchor="middle">唾液や分泌物が</text>
<text x="600" y="653" class="body" text-anchor="middle">気道に入る場合</text><rect x="848" y="208" width="314" height="483" rx="24" fill="#fff" stroke="#bbdcea" stroke-width="3"/>
<rect x="861" y="223" width="288" height="76" rx="18" fill="#dbf1fa"/>
<text x="1005" y="273" class="h" text-anchor="middle">肺炎などのリスク</text>
<text x="1005" y="613" class="body" text-anchor="middle">術後合併症の</text>
<text x="1005" y="653" class="body" text-anchor="middle">一因になりうる</text><!-- Oral cavity icon: tooth with plaque -->
