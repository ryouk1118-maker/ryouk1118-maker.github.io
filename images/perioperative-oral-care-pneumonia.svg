<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 895" role="img" aria-label="口腔衛生と術後肺炎リスクの関係を示す模式図"><defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#eef8fc"/></linearGradient><style>text{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#214d64}.t{font-weight:800;font-size:43px}.sub{font-size:23px;fill:#4b7186}.h{font-size:30px;font-weight:800}.body{font-size:25px}.sm{font-size:20px;fill:#607f8e}.white{fill:#fff}.key{fill:#287da3;font-weight:800}</style></defs>
