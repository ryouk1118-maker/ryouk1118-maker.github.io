<rect x="443" y="910" width="284" height="61" rx="15" fill="#fff"/><text x="585" y="950" class="body" text-anchor="middle">歯の固定・保護等</text>
<path d="M743 939h55m-14-13 18 13-18 13" fill="none" stroke="#5ca7c7" stroke-width="5"/>
<rect x="818" y="910" width="316" height="61" rx="15" fill="#fff"/><text x="976" y="950" class="body" text-anchor="middle">主治医・麻酔科へ共有</text>
<text x="47" y="1040" class="sm">※ 必要な処置は一人ひとり異なります。必ず抜歯するわけではありません。</text>
