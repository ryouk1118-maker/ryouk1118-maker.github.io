<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1070" role="img" aria-label="手術前の歯科受診で確認すること"><defs><linearGradient id="p" x2="0" y2="1"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#eef8fc"/></linearGradient><style>text{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#214d64}.t{font-weight:800;font-size:42px}.sub{font-size:23px;fill:#4b7186}.h{font-size:31px;font-weight:800}.body{font-size:24px}.sm{font-size:20px;fill:#607f8e}.n{font-size:31px;font-weight:800;fill:#fff}</style></defs><rect width="1200" height="1070" rx="28" fill="url(#p)"/><rect width="1200" height="112" rx="25" fill="#daf2fb"/><rect y="91" width="1200" height="21" fill="#daf2fb"/><text x="46" y="72" class="t">手術前の歯科でチェックすること</text><text x="48" y="156" class="sub">手術中・手術後のトラブルに備え、口の状態を確認します。</text><rect x="40" y="202" width="539" height="279" rx="24" fill="#fff" stroke="#badce9" stroke-width="3"/><rect x="57" y="219" width="505" height="69" rx="15" fill="#e0f2fa"/><circle cx="90" cy="253" r="26" fill="#3a94b8"/><text x="90" y="263" font-size="23" text-anchor="middle" font-weight="800" fill="#fff">01</text><text class="h" x="138" y="264">ぐらぐらする歯</text><text class="body" x="227" y="389">挿管時に外れたり、</text><text class="body" x="227" y="425">傷ついたりしないか</text><rect x="620" y="202" width="539" height="279" rx="24" fill="#fff" stroke="#badce9" stroke-width="3"/><rect x="637" y="219" width="505" height="69" rx="15" fill="#e0f2fa"/><circle cx="670" cy="253" r="26" fill="#3a94b8"/><text x="670" y="263" font-size="23" text-anchor="middle" font-weight="800" fill="#fff">02</text><text class="h" x="718" y="264">詰め物・被せ物</text><text class="body" x="807" y="389">外れそうな装置や</text><text class="body" x="807" y="425">傷んだ歯がないか</text><rect x="40" y="510" width="539" height="279" rx="24" fill="#fff" stroke="#badce9" stroke-width="3"/><rect x="57" y="527" width="505" height="69" rx="15" fill="#e0f2fa"/><circle cx="90" cy="561" r="26" fill="#3a94b8"/><text x="90" y="571" font-size="23" text-anchor="middle" font-weight="800" fill="#fff">03</text><text class="h" x="138" y="572">むし歯・歯周病</text><text class="body" x="227" y="697">炎症や感染の原因が</text><text class="body" x="227" y="733">残っていないか</text><rect x="620" y="510" width="539" height="279" rx="24" fill="#fff" stroke="#badce9" stroke-width="3"/><rect x="637" y="527" width="505" height="69" rx="15" fill="#e0f2fa"/><circle cx="670" cy="561" r="26" fill="#3a94b8"/><text x="670" y="571" font-size="23" text-anchor="middle" font-weight="800" fill="#fff">04</text><text class="h" x="718" y="572">口の汚れ・入れ歯</text><text class="body" x="807" y="697">歯垢・歯石や義歯の</text><text class="body" x="807" y="733">状態を確認できるか</text><g transform="translate(101 322) rotate(-9 55 55)"><path d="M7 6Q-6-19 21-24Q40-28 53-17Q75-31 97-17Q114 0 105 24L88 58L75 108Q70 121 61 108L51 73L36 109Q28 123 22 104L18 58Z" fill="#fff" stroke="#779cae" stroke-width="4"/></g><path d="M92 335l-18 20m140 16 18 19" stroke="#e4a45a" stroke-width="6" stroke-linecap="round"/><g transform="translate(678 322) rotate(0 55 55)"><path d="M7 6Q-6-19 21-24Q40-28 53-17Q75-31 97-17Q114 0 105 24L88 58L75 108Q70 121 61 108L51 73L36 109Q28 123 22 104L18 58Z" fill="#fff" stroke="#779cae" stroke-width="4"/></g><path d="M699 339h71" stroke="#c3d4da" stroke-width="7"/><rect x="694" y="327" width="85" height="14" rx="5" fill="#e6dfbd" stroke="#b2a785" stroke-width="2"/><g transform="translate(100 620) rotate(0 55 55)"><path d="M7 6Q-6-19 21-24Q40-28 53-17Q75-31 97-17Q114 0 105 24L88 58L75 108Q70 121 61 108L51 73L36 109Q28 123 22 104L18 58Z" fill="#fff" stroke="#779cae" stroke-width="4"/></g><ellipse cx="143" cy="633" rx="49" ry="13" fill="#f5bec1"/><path d="M113 614Q139 584 170 614" fill="none" stroke="#d77e83" stroke-width="12"/><circle cx="172" cy="610" r="8" fill="#be6873"/><g transform="translate(680 630)"><rect x="6" y="11" width="126" height="42" rx="20" fill="#f6c7c1" stroke="#b97779" stroke-width="3"/><path d="M25 23q13-13 26 0v12q-10 18-26 0z" fill="#fff" stroke="#89a8ae" stroke-width="2"/><path d="M55 23q13-13 26 0v12q-10 18-26 0z" fill="#fff" stroke="#89a8ae" stroke-width="2"/><path d="M85 23q13-13 26 0v12q-10 18-26 0z" fill="#fff" stroke="#89a8ae" stroke-width="2"/><path d="M13 57Q70 91 130 57" fill="none" stroke="#c8858a" stroke-width="6"/></g><rect x="40" y="827" width="1120" height="176" rx="25" fill="#e0f4fa" stroke="#a9d7e9" stroke-width="3"/>
<text x="69" y="879" class="h">確認したあと、必要な対応を選びます</text>
<rect x="67" y="910" width="284" height="61" rx="15" fill="#fff"/><text x="209" y="950" class="body" text-anchor="middle">口腔ケア・治療</text>
