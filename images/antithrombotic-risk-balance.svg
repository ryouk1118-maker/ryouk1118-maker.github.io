<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" role="img" aria-label="抗血栓薬と抜歯｜2つのリスク"><rect width="1200" height="1080" fill="#f6fbfd"/><rect width="1200" height="110" fill="#daf1fa"/><rect y="108" width="1200" height="4" fill="#80c9df"/><style>text{font-family:"Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#20485e}.title{font-size:43px;font-weight:800}.sub{font-size:25px;fill:#576e7b}.head{font-size:34px;font-weight:800}.body{font-size:29px}.small{font-size:22px;fill:#647a86}.white{fill:#fff}.bold{font-weight:800}.label{font-size:25px;font-weight:700}</style><text class="title" x="55" y="73">抗血栓薬と抜歯｜2つのリスク</text><text class="sub" x="58" y="155">出血のリスクと、薬を止めるリスクの両方を考えます。</text>
<rect x="50" y="196" width="523" height="592" rx="27" fill="#edf7fc" stroke="#c5e1ef" stroke-width="3"/>
<rect x="627" y="196" width="523" height="592" rx="27" fill="#fff5f0" stroke="#f1d5cb" stroke-width="3"/>
<rect x="73" y="219" width="477" height="94" rx="20" fill="#d3ecf8"/><rect x="650" y="219" width="477" height="94" rx="20" fill="#ffe2d7"/>
<path d="M115 246l23-8 23 8v25l-23 27-23-27z" fill="none" stroke="#2284ad" stroke-width="5"/><path d="M126 267l10 10 16-19" fill="none" stroke="#2284ad" stroke-width="5"/>
<circle cx="691" cy="265" r="22" fill="none" stroke="#b76544" stroke-width="5"/><path d="M676 265h30M691 249v32" stroke="#b76544" stroke-width="4"/>
<text class="head" x="180" y="279">服用を続けて抜歯</text><text class="head" x="742" y="279">自己判断で薬を中止</text>
<text class="head" x="82" y="390" fill="#1c769b">考慮すること：出血</text><text class="head" x="660" y="390" fill="#b15d3f">考慮すること：血栓</text>
<circle cx="94" cy="457" r="8" fill="#218bab"/><text class="body" x="118" y="468">出血が続いたり、</text><text class="body" x="118" y="512">止まりにくい場合がある</text>
<circle cx="94" cy="582" r="8" fill="#218bab"/><text class="body" x="118" y="593">局所止血で対応できる</text><text class="body" x="118" y="637">ことも多い</text>
<circle cx="671" cy="457" r="8" fill="#cf7b58"/><text class="body" x="696" y="468">血栓ができやすくなる</text><text class="body" x="696" y="512">場合がある</text>
<circle cx="671" cy="582" r="8" fill="#cf7b58"/><text class="body" x="696" y="593">脳梗塞・心筋梗塞など</text><text class="body" x="696" y="637">重大な問題につながる</text><text class="body" x="696" y="681">こともある</text>
<rect x="50" y="821" width="1100" height="151" rx="23" fill="#dcf2fa" stroke="#a1d2e5" stroke-width="3"/>
<text class="head" x="82" y="871">いちばん大切なこと</text><text class="body bold" x="82" y="926">薬の種類・抜歯の内容・体調を確認し、医療者と相談して判断</text>
<text class="small" x="58" y="1021">※ 自己判断で休薬・変更しないでください。対応は薬剤・病状によって異なります。</text>
</svg>