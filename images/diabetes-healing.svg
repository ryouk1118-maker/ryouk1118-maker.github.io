<text class="h3" x="86" y="720">通常どおり治る方もいる</text><text class="b" x="86" y="764">血糖が安定していれば、</text><text class="b" x="86" y="803">大きな問題なく治ることも。</text>
<text class="h3" x="670" y="720">感染や治癒遅延に注意</text><text class="b" x="670" y="764">感染しやすくなったり、</text><text class="b" x="670" y="803">傷が治るのに時間がかかることも。</text>
<rect x="38" y="874" width="1124" height="118" rx="22" fill="#e0f3fa" stroke="#b7deec" stroke-width="2"/>
<text class="h3" x="72" y="921">大切なのは、HbA1cの数字だけで判断しないこと。</text>
<text class="b" x="72" y="966">最近の血糖値・治療状況・感染の有無・抜歯の難しさも確認します。</text>
<text class="xs" x="48" y="1030">※ 一般的な模式図です。糖尿病があっても、すべての方に合併症が起こるわけではありません。</text>
</svg>