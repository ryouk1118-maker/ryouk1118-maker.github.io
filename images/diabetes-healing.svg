.w{fill:white}.bl{fill:#187ea5}.warm{fill:#a15d46}.heavy{font-weight:800}
</style><text class="h1" x="46" y="75">糖尿病と抜歯後の傷の治り方</text><text class="lead" x="48" y="161">血糖コントロールの状態によって、注意すべき点が変わります。</text>
