<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050" role="img" aria-label="糖尿病と抜歯後の傷の治り方"><rect width="1200" height="1050" fill="#f7fcfe"/><rect x="0" y="0" width="1200" height="115" rx="26" fill="#d9eff8"/><rect x="0" y="90" width="1200" height="25" fill="#d9eff8"/><style>
text{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#21485d}
.h1{font-size:47px;font-weight:800}.lead{font-size:26px;fill:#527184}
.h2{font-size:35px;font-weight:800}.h3{font-size:30px;font-weight:700}
